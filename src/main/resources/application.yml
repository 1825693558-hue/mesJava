server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: mes-backend
  datasource:
    url: jdbc:mysql://localhost:3306/mes_demo?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 112233
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  secret: mes-demo-secret-key-2026-must-be-at-least-32-characters
  expiration: 28800000
  header: Authorization
  prefix: "Bearer "

# Knife4j 文档
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.demo.mes: debug
