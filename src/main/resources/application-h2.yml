server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: mes-backend
  datasource:
    url: jdbc:h2:mem:mes_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql
      data-locations: classpath:sql/data-h2.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: mes-demo-secret-key-2026-must-be-at-least-32-characters
  expiration: 28800000
  header: Authorization
  prefix: "Bearer "

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.demo.mes: debug
